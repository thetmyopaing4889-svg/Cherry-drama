openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cherry Drama - AI Movie Recap API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Recap job operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all recap jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new recap job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get job statistics
      responses:
        "200":
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /jobs/{id}/progress:
    patch:
      operationId: updateJobProgress
      tags: [jobs]
      summary: Update job progress (internal use)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobProgressUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Job:
      type: object
      required: [id, movieTitle, language, status, progress, stage, createdAt]
      properties:
        id:
          type: integer
        movieTitle:
          type: string
        language:
          type: string
          enum: [myanmar, japanese]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
        outputUrl:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        durationSeconds:
          type: ["integer", "null"]
        recommendedDuration:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
    JobInput:
      type: object
      required: [movieTitle, language]
      properties:
        movieTitle:
          type: string
          minLength: 1
        language:
          type: string
          enum: [myanmar, japanese]
        videoFilename:
          type: string
    JobProgressUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
        outputUrl:
          type: string
        thumbnailUrl:
          type: string
        durationSeconds:
          type: integer
        recommendedDuration:
          type: integer
        error:
          type: string
    JobStats:
      type: object
      required: [total, completed, processing, failed, pending]
      properties:
        total:
          type: integer
        completed:
          type: integer
        processing:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
